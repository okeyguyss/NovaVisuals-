name: Build NovaVisuals

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('build.gradle', 'gradle.properties') }}
      - name: Build
        run: |
          chmod +x gradlew
          for i in 1 2 3; do
            ./gradlew build --no-daemon --stacktrace && exit 0
            echo "Retry $i..."
            sleep 20
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: NovaVisuals-1.16.5
          path: build/libs/*.jar
